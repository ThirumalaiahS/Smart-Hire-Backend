name: Build and Test

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
  push:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore SmartHire.sln

    - name: Build
      run: dotnet build SmartHire.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test SmartHire.sln --no-build --configuration Release --verbosity normal
